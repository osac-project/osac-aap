---
# Workflow: Cleanup Stale Network Resources
# This workflow cleans up stale network resources.
# Generic hooks allow customization at workflow boundaries.
#
# Usage:
#   - name: Cleanup stale network resources
#     ansible.builtin.import_playbook: osac.workflows.maintenance.cleanup_stale_network_resources
#
# Hook example:
#   - name: Cleanup with custom hooks
#     ansible.builtin.import_playbook: osac.workflows.maintenance.cleanup_stale_network_resources
#     vars:
#       hook_workflow_start:
#         name: my_custom_hooks
#         tasks_from: pre_cleanup.yml

- name: Cleanup stale network resources
  hosts: localhost
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"


  vars:
    # GENERIC HOOKS - Default to noop
    hook_workflow_start_default:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml

    hook_workflow_complete_default:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml

    # MAINTENANCE STEP - Default to noop, override for specific maintenance tasks
    step_maintenance_default:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml

  collections:
    - osac.workflows
    - osac.service

  tasks:
    # HOOK: Workflow start
    - name: Hook - Workflow start
      ansible.builtin.include_role:
        name: "{{ (hook_workflow_start | default(hook_workflow_start_default)).name }}"
        tasks_from: "{{ (hook_workflow_start | default(hook_workflow_start_default)).tasks_from }}"

    # STEP: Perform maintenance (overrideable for specific maintenance tasks)
    - name: Step - Perform maintenance
      ansible.builtin.include_role:
        name: "{{ (step_maintenance_override | default(step_maintenance_default)).name }}"
        tasks_from: "{{ (step_maintenance_override | default(step_maintenance_default)).tasks_from | default(omit) }}"

    # HOOK: Workflow complete
    - name: Hook - Workflow complete
      ansible.builtin.include_role:
        name: "{{ (hook_workflow_complete | default(hook_workflow_complete_default)).name }}"
        tasks_from: "{{ (hook_workflow_complete | default(hook_workflow_complete_default)).tasks_from }}"
