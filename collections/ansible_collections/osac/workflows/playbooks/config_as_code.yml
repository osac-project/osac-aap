---
# Workflow: Config as Code
# This workflow configures Ansible Automation Platform using config-as-code playbooks.
# Generic hooks allow customization at workflow boundaries.
#
# Usage:
#   - name: Configure AAP
#     ansible.builtin.import_playbook: osac.workflows.config_as_code
#
# Hook example:
#   - name: Configure with custom hooks
#     ansible.builtin.import_playbook: osac.workflows.config_as_code
#     vars:
#       hook_workflow_start:
#         name: my_custom_hooks
#         tasks_from: pre_config.yml

- name: Config as code workflow - Set AAP license
  hosts: localhost
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"


  vars:
    # GENERIC HOOKS - Default to noop
    hook_workflow_start_default:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml

  collections:
    - osac.workflows
    - osac.config_as_code

  tasks:
    # HOOK: Workflow start
    - name: Hook - Workflow start
      ansible.builtin.include_role:
        name: "{{ (hook_workflow_start | default(hook_workflow_start_default)).name }}"
        tasks_from: "{{ (hook_workflow_start | default(hook_workflow_start_default)).tasks_from }}"

- name: Set AAP license
  ansible.builtin.import_playbook: osac.config_as_code.subscription

- name: Configure AAP
  ansible.builtin.import_playbook: osac.config_as_code.configure

- name: Config as code workflow - Complete
  hosts: localhost
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG')) | default(lookup('env', 'HOME') + '/.kube/config') }}"


  vars:
    # GENERIC HOOKS - Default to noop
    hook_workflow_complete_default:
      name: osac.workflows.workflow_helpers
      tasks_from: noop.yml

  collections:
    - osac.workflows

  tasks:
    # HOOK: Workflow complete
    - name: Hook - Workflow complete
      ansible.builtin.include_role:
        name: "{{ (hook_workflow_complete | default(hook_workflow_complete_default)).name }}"
        tasks_from: "{{ (hook_workflow_complete | default(hook_workflow_complete_default)).tasks_from }}"
