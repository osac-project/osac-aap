---
- name: "Compute effective record name for dnsmasq - {{ dns_record_name }}"
  ansible.builtin.set_fact:
    _dnsmasq_effective_name: "{{ dns_record_name | regex_replace('^\\*\\.', '') }}"
    _dnsmasq_zone_file: "{{ dns_dnsmasq_config_dir }}/{{ dns_dnsmasq_file_prefix }}-{{ dns_zone }}.conf"

- name: "Ensure dnsmasq zone config file exists - {{ dns_zone }}"
  ansible.builtin.file:
    path: "{{ _dnsmasq_zone_file }}"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  delegate_to: "{{ dns_dnsmasq_host }}"

- name: "Create DNS record via dnsmasq - {{ dns_record_name }}"
  ansible.builtin.lineinfile:
    path: "{{ _dnsmasq_zone_file }}"
    regexp: "{{ (dns_record_overwrite | default(true)) | ternary('^address=/' + _dnsmasq_effective_name + '/', omit) }}"
    line: "address=/{{ _dnsmasq_effective_name }}/{{ dns_record_value }}"
    state: present
  delegate_to: "{{ dns_dnsmasq_host }}"

- name: "Reload dnsmasq after record create - {{ dns_record_name }}"
  ansible.builtin.systemd_service:
    name: dnsmasq
    state: reloaded
  delegate_to: "{{ dns_dnsmasq_host }}"
