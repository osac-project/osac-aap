---
- name: Maintenance Cleanup - Baseline Test
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: No specific setup needed for baseline
      ansible.builtin.debug:
        msg: "Running maintenance cleanup baseline test"

- name: Import maintenance cleanup workflow (baseline)
  ansible.builtin.import_playbook: osac.workflows.maintenance.cleanup_stale_network_resources

- name: Verify baseline results
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../common_vars.yml

  tasks:
    - name: Verify workflow completed without errors
      ansible.builtin.debug:
        msg: "Baseline maintenance workflow completed successfully"
